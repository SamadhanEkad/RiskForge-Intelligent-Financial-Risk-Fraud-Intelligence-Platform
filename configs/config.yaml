project:
  name: "RiskForge"
  version: "1.0.0"
  description: "Intelligent Financial Risk & Fraud Intelligence Platform"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  sample_data_dir: "data/sample"
  models_dir: "models"
  figures_dir: "reports/figures"

data:
  raw_transactions_file: "train_transaction.csv"
  raw_identity_file: "train_identity.csv"
  sample_transactions_file: "sample_transactions.parquet"
  processed_features_file: "features_matrix.parquet"

features:
  id_column: "TransactionID"
  time_column: "TransactionDT"
  target_column: "isFraud"
  amount_column: "TransactionAmt"
  card_columns: ["card1", "card2", "card3", "card4", "card5", "card6"]
  identity_columns: ["DeviceInfo", "DeviceType", "id_30", "id_31", "id_33"]
  categorical_columns:
    - "ProductCD"
    - "card4"
    - "card6"
    - "P_emaildomain"
    - "R_emaildomain"
    - "DeviceType"

validation:
  time_split_ratio: 0.8  # First 80% chronological for train, last 20% for out-of-time test
  k_folds: 5

modeling:
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 15.0
    random_state: 42

explainability:
  top_shap_features: 5
